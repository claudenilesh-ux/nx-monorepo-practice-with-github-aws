services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: archloom
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in apps/express-api/.env.local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in apps/express-api/.env.local}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d archloom']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
